<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14100e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Remorse Chess</title>
<style>
@font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/cormorant-garamond-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/inter-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/inter-latin-600-normal.woff2) format('woff2')}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="description" content="Remorse Chess: chess where every capture leaves a mark on the piece that made it.">
</head>
<body>
<style>
/* Layout: one-screen phone app. Header, opponent strip, square board, player strip,
   chronicle (last three events), action slot, five-button bar. Sheets slide up for menus. */
:root {
  --ink: #14100e;
  --panel: #1e1714;
  --panel-2: #2a211d;
  --line: #3b2f29;
  --bone: #ece1c9;
  --ash: #a39786;
  --ember: #d04a37;
  --halo: #e2b657;
  --sq-light: #d9c7a4;
  --sq-dark: #7a5a43;
  --f-display: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --f-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --gutter: 16px;
  color-scheme: dark;
}
html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; background: var(--ink); color: var(--bone);
  font: 15px/1.4 var(--f-body); overflow: hidden; overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .sq:focus-visible { outline: 2px solid var(--halo); outline-offset: 2px; }

#app {
  height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column;
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
  padding-block: 4px 0;
}
.top { display: flex; flex-direction: column; gap: 3px; padding: 6px 2px 8px; }
h1 { margin: 0; font: 600 30px/1 var(--f-display); letter-spacing: .01em; white-space: nowrap; }
.tag { margin: 0; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ash); white-space: nowrap; }

/* player strips */
.strip { display: flex; align-items: center; gap: 9px; height: 42px; padding: 0 10px; border-radius: 10px; border: 1px solid transparent; transition: background .2s; }
.strip.on { background: var(--panel); border-color: var(--line); }
.chip { width: 15px; height: 15px; border-radius: 50%; flex: none; border: 2px solid; }
.chip.w { background: #f3ead5; border-color: #8c7a63; }
.chip.b { background: #2c2125; border-color: #8c7a63; }
.nm { font-weight: 600; }
.sub { color: var(--ash); font-size: 13px; }
.think { color: var(--halo); font-size: 13px; }
.think i { animation: blink 1.2s infinite; font-style: normal; }
.think i:nth-child(2) { animation-delay: .2s; } .think i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 60%, 100% { opacity: .2 } 30% { opacity: 1 } }
.stats { margin-left: auto; display: flex; gap: 12px; align-items: center; font-size: 13px; font-variant-numeric: tabular-nums; }
.st { display: inline-flex; align-items: center; gap: 4px; color: var(--ash); }
.st.warn { color: var(--ember); }
.mini { width: 19px; height: 19px; fill: var(--bone); stroke: var(--ash); stroke-width: 1.6; stroke-linejoin: round; }
.dot { width: 11px; height: 11px; border-radius: 50%; background: #1a1010; box-shadow: 0 0 0 1.5px var(--ember); }

/* board */
#boardwrap { position: relative; width: min(100%, calc(100dvh - 365px)); min-width: 240px; margin: 4px auto; flex: none; }
#board {
  display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
  aspect-ratio: 1; border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 2px #0b0807, 0 10px 28px rgba(0, 0, 0, .55);
}
.sq { position: relative; min-width: 0; min-height: 0; }
.sq.light { background: var(--sq-light); } .sq.dark { background: var(--sq-dark); }
.sq.last::before { content: ""; position: absolute; inset: 0; background: rgba(226, 182, 87, .38); z-index: 1; }
.sq.sel::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 3px var(--halo); background: rgba(226, 182, 87, .28); z-index: 1; }
.sq.chk { background-image: radial-gradient(circle at 50% 55%, rgba(208, 74, 55, .95) 0%, rgba(208, 74, 55, 0) 72%); }
.rk, .fl { position: absolute; font-size: 9px; font-weight: 700; z-index: 1; line-height: 1; pointer-events: none; }
.rk { top: 3px; left: 3px; } .fl { right: 3px; bottom: 2px; }
.light .rk, .light .fl { color: var(--sq-dark); } .dark .rk, .dark .fl { color: var(--sq-light); }

.pcw { position: absolute; inset: 2%; z-index: 3; pointer-events: none; }
.pc { width: 100%; height: 100%; display: block; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; fill: var(--pf); stroke: var(--ps); }
.pc.w { --pf: #f3ead5; --ps: #241812; } .pc.b { --pf: #2c2125; --ps: #e8dabc; }
#board.face .pc.b { transform: rotate(180deg); }
.sq.guilty .pcw { transform: translateY(-9%); }
.sq.guilty .pc { filter: saturate(.35) brightness(.82); }
.token {
  position: absolute; left: 8%; right: 8%; bottom: 3%; height: 31%; border-radius: 50%; z-index: 2;
  background: radial-gradient(ellipse at 50% 35%, #4d3131 0%, #1a1010 72%);
  box-shadow: 0 0 0 1.5px var(--ember), 0 0 9px rgba(208, 74, 55, .55), 0 2px 5px rgba(0, 0, 0, .6);
}
.token.fresh { animation: drop .5s cubic-bezier(.2, .8, .2, 1); }
@keyframes drop { from { transform: translateY(-70%) scale(1.6); opacity: 0 } to { transform: none; opacity: 1 } }
.ripple { position: absolute; inset: 6%; border-radius: 50%; border: 3px solid var(--halo); z-index: 5; pointer-events: none; animation: rip .95s ease-out forwards; }
@keyframes rip { from { transform: scale(.4); opacity: 1 } to { transform: scale(1.55); opacity: 0 } }

.hint { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; pointer-events: none; }
.hint::after { content: ""; border-radius: 50%; }
.hint.quiet::after { width: 28%; height: 28%; background: rgba(20, 16, 14, .38); }
.hint.cap::after { width: 90%; height: 90%; border: 4px solid rgba(208, 74, 55, .8); }
.hint.abs::after { width: 46%; height: 46%; background: radial-gradient(circle, #fff3c8, var(--halo)); box-shadow: 0 0 12px 3px rgba(226, 182, 87, .85); }

/* chronicle + action */
#chron { flex: 1 1 0; min-height: 66px; overflow: hidden; padding: 8px 4px 2px; display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; }
.ln { color: #7d7266; display: flex; gap: 8px; align-items: baseline; }
.ln:nth-child(n+4) { opacity: .6; } .ln:nth-child(n+6) { opacity: .35; }
.ln:first-child { color: var(--bone); font-size: 15px; }
.ln::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--line); flex: none; transform: translateY(-1px); }
.ln.guilt::before { background: var(--ember); } .ln.abs::before { background: var(--halo); } .ln.check::before { background: #fff; }
#act { min-height: 50px; display: flex; align-items: center; justify-content: center; padding: 2px 0; }
.pill { min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--halo); background: rgba(226, 182, 87, .12); color: var(--halo); font-weight: 600; font-size: 14px; }
.pill[disabled] { border-color: var(--line); color: var(--ash); background: none; cursor: default; }
.note { color: var(--ash); font-size: 13px; }

#bar { margin-top: auto; display: grid; grid-template-columns: repeat(6, 1fr); border-top: 1px solid var(--line); padding-block: 4px; }
#bar button { background: none; border: 0; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: var(--ash); letter-spacing: .03em; border-radius: 10px; }
#bar button:active { background: var(--panel); color: var(--bone); }
#bar button[disabled] { opacity: .35; }
#bar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* sheets */
.scrim { position: fixed; inset: 0; background: rgba(8, 5, 4, .62); z-index: 20; animation: fade .2s; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 88%; overflow: auto;
  max-width: 560px; margin: 0 auto; background: var(--panel); border-top: 1px solid var(--line);
  border-radius: 20px 20px 0 0; animation: up .24s cubic-bezier(.2, .8, .2, 1);
  padding: 8px max(20px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
}
@keyframes up { from { transform: translateY(40px); opacity: 0 } }
@keyframes fade { from { opacity: 0 } }
.grab { width: 38px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 14px; }
.sheet h2 { margin: 0 0 4px; font: 600 28px/1.1 var(--f-display); }
.sheet h3 { margin: 18px 0 8px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ash); font-weight: 600; }
.sheet p { margin: 6px 0; color: #cfc4af; }
.sheet .lead { color: var(--bone); font-size: 16px; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; min-height: 46px; border-radius: 11px; border: 1px solid var(--line); background: var(--panel-2); font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--halo); color: #1b130d; border-color: var(--halo); font-weight: 600; }
.row { display: flex; align-items: center; justify-content: space-between; min-height: 48px; gap: 12px; }
.sw { width: 50px; height: 30px; border-radius: 15px; border: 1px solid var(--line); background: var(--panel-2); position: relative; flex: none; padding: 0; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--ash); transition: transform .15s; }
.sw[aria-checked="true"] { background: var(--halo); border-color: var(--halo); }
.sw[aria-checked="true"]::after { transform: translateX(20px); background: #1b130d; }
.btns { display: flex; gap: 8px; margin-top: 20px; }
.btn { flex: 1; min-height: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); font-weight: 600; }
.btn.primary { background: var(--halo); border-color: var(--halo); color: #1b130d; }
.rules li { margin: 0 0 10px; color: #cfc4af; } .rules ol { padding-left: 20px; margin: 10px 0; }
.rules b { color: var(--bone); }
.rules .k { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px; margin-right: 2px; }
.promo { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
.promo button { aspect-ratio: 1; border-radius: 14px; border: 1px solid var(--line); background: var(--sq-light); padding: 6px; }
.promo .pc { width: 100%; height: 100%; }
table.hist { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.hist td { padding: 7px 4px; border-bottom: 1px solid var(--line); }
.hist td:first-child { color: var(--ash); width: 34px; }
.hist .g { color: #ff9d8e; } .hist .a { color: var(--halo); }
.result { text-align: center; padding-top: 6px; }
.result h2 { font-size: 36px; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* reactions: tokens, badges, dice */
.sq.dev .pcw { transform: translateY(-6%) rotate(-17deg); }
.sq.dev .pc { filter: grayscale(1) brightness(.7); }
.sq.psy::before { content: ""; position: absolute; inset: 0; z-index: 1; background: radial-gradient(circle at 50% 55%, rgba(208, 74, 55, .38), transparent 70%); }
.bdg { position: absolute; z-index: 6; display: grid; place-items: center; border-radius: 50%; pointer-events: none; font-weight: 700; line-height: 1; }
.bdg.dv, .bdg.ps, .bdg.bl { top: 2%; right: 2%; width: 38%; height: 38%; background: #2a0f0d; color: #ffd9d2; box-shadow: 0 0 0 1.5px var(--ember); font-size: 12px; }
.bdg.ps { font-family: var(--f-display); font-size: 14px; }
.bdg.bl { animation: throb 1.4s ease-in-out infinite; }
.bdg.bl svg { width: 62%; height: 62%; fill: var(--ember); }
@keyframes throb { 50% { box-shadow: 0 0 0 1.5px var(--ember), 0 0 9px 2px rgba(208, 74, 55, .8); } }
.bdg.sm { left: 3%; bottom: 3%; width: 34%; height: 34%; background: #2a0f0d; box-shadow: 0 0 0 1.5px #fff; }
.bdg.sm svg { width: 74%; height: 74%; fill: none; stroke: #fff; stroke-width: 2; stroke-linejoin: round; }
.bdg.sm circle { fill: #fff; stroke: none; }
.bdg.fr { right: 3%; bottom: 3%; width: 34%; height: 34%; background: #1d1608; box-shadow: 0 0 0 1.5px var(--halo); }
.bdg.fr svg { width: 66%; height: 66%; fill: var(--halo); }
.ripple.bad { border-color: var(--ember); }
#dice { position: absolute; left: 8px; right: 8px; top: 8px; z-index: 12; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 8px; border-radius: 12px; background: rgba(20, 16, 14, .92); border: 1px solid var(--line); opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity .2s, transform .2s; }
#dice.on { opacity: 1; transform: none; pointer-events: auto; }
#dice:empty { display: none; }
.die { display: grid; grid-template-columns: 30px auto; grid-template-rows: auto auto; column-gap: 7px; align-items: center; min-width: 0; }
.die svg { grid-row: 1 / 3; width: 30px; height: 30px; fill: var(--bone); }
.die svg rect { fill: var(--bone); } .die svg circle { fill: var(--ink); }
.die b { font-size: 13px; line-height: 1.1; } .die span { font-size: 12px; color: var(--halo); line-height: 1.1; }
.die.more { display: flex; align-items: center; color: var(--ash); }
.note.warn { color: #ff9d8e; }
.dtab { width: 100%; border-collapse: collapse; margin: 6px 0 10px; font-size: 14px; }
.dtab td { padding: 7px 4px; border-bottom: 1px solid var(--line); vertical-align: top; color: #cfc4af; }
.dtab td:first-child { width: 46px; color: var(--halo); font-weight: 700; font-variant-numeric: tabular-nums; }

/* tutorial */
#tut { display: none; }
body.tutorial #tut { display: block; flex: 1 1 0; min-height: 0; overflow: auto; padding: 6px 2px 0; }
body.tutorial .strip, body.tutorial #chron, body.tutorial #bar { display: none; }
.thead { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ash); }
.thead button { min-height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); font-size: 12px; letter-spacing: .06em; }
.tdots { display: flex; gap: 5px; margin: 6px 0 10px; }
.tdots i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.tdots i.done { background: var(--ash); } .tdots i.now { background: var(--halo); }
#tut .say { margin: 0 0 8px; font-size: 16px; line-height: 1.45; }
#tut .after { margin: 0 0 8px; color: var(--halo); font-size: 15px; }
#tut .tip { margin: 0 0 8px; color: #ff9d8e; font-size: 14px; }
#tut h2 { margin: 0 0 4px; font: 600 26px/1.1 var(--f-display); }
#tut p { color: #cfc4af; }
#tut .btns { margin-top: 10px; }
.sq.th::after { content: ""; position: absolute; inset: 0; z-index: 7; pointer-events: none; box-shadow: inset 0 0 0 3px var(--halo); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: inset 0 0 0 5px var(--halo), inset 0 0 14px rgba(226, 182, 87, .7); } }
.lessons { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.lessons button { display: flex; align-items: center; gap: 12px; text-align: left; min-height: 56px; padding: 6px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); }
.lessons .num { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--halo); font-weight: 700; font-size: 13px; }
.lessons b { display: block; font-weight: 600; } .lessons small { color: var(--ash); font-size: 12.5px; }
body.tutorial #tut { order: 1; }
body.tutorial #act:empty { display: none; }

#tut .said { margin: 0 0 8px; padding: 8px 10px; border-left: 2px solid var(--halo); background: rgba(226,182,87,.07); border-radius: 0 8px 8px 0; }
#tut .said p { margin: 0 0 3px; font-size: 14px; line-height: 1.4; color: #e8dfcc; }
#tut .said p:last-child { margin: 0; }
#tut .tip2 { margin: 0 0 8px; font-size: 14px; color: #cfc4af; }

#tut .btns { position: sticky; bottom: 0; background: var(--ink); padding: 8px 0 max(8px, env(safe-area-inset-bottom, 0px)); }

.scrim.still, .sheet.still { animation: none; }

.sheet { overscroll-behavior: contain; }
.grab { position: relative; }
.grab::after { content: ""; position: absolute; left: -60px; right: -60px; top: -10px; bottom: -14px; }

</style>

    for (let k = 0; k < nb.length; k++) { const i = nb[k]; if (b[i] === by * K && !g[i]) return true; }

      while (rr >= 0 && rr < 8 && cc >= 0 && cc < 8) {

  }

  /* ---------- move generation ---------- */

    const b = s.b, g = s.g, col = s.turn, out = [], only = s.extra;
    const useGuilt = config.guilt, dice = useGuilt;

      const pc = b[f];

      if (only >= 0 && f !== only) continue;
      if (dice && s.d[f]) continue; // devastated: immobile
      const t = pc * col, r = f >> 3, c = f & 7;
      const guilty = useGuilt && (g[f] === 1 || t === B); // guilt-ridden pieces and bishops cannot capture
      const blood = dice && s.r[f] === 4 && s.n[f] >= 3;
            const capture = (to, p, e) => {
        const target = e ? P : Math.abs(b[to]);
        const m = mv(f, to, p, target, e);
        if (!e && b[to] * col > 0) m.fr = 1;

      };
      if (t === P) {
        const dir = col === 1 ? -1 : 1, start = col === 1 ? 6 : 1, promo = col === 1 ? 0 : 7;
        const r1 = r + dir;

      for (let i = 0; i < 64; i++) {

      <h3>Credits</h3><p class="note">${creditLine()}</p></div>
      <div class="btns"><button class="btn" id="rLearn">Take the tutorial</button><button class="btn primary" id="rClose">Got it</button></div>`);
    $('#rClose').onclick = closeSheet;
    $('#rLearn').onclick = tutorialSheet;
  }
  function movesSheet() {
    let rows = '';
    for (let i = 0; i < app.plies.length; i += 2) {
      const cell = (p) => p ? `<td class="${p.g ? 'g' : p.a ? 'a' : ''}">${esc(p.san)}</td>` : '<td></td>';
      rows += `<tr><td>${i / 2 + 1}.</td>${cell(app.plies[i])}${cell(app.plies[i + 1])}</tr>`;
    }
    sheet(`<h2>Moves</h2><p><span style="color:#ff9d8e">Red</span> moves left a guilty piece. <span style="color:var(--halo)">Gold</span> moves cleared one.</p>
      ${rows ? `<table class="hist">${rows}</table>` : '<p class="note">No moves yet.</p>'}
      <div class="btns"><button class="btn primary" id="mClose">Close</button></div>`);
    $('#mClose').onclick = closeSheet;
  }
  function welcomeSheet() {
    const sh = sheet(`<h2>Remorse Chess</h2><p class="lead">Chess where every capture changes the piece that made it.</p>
      <p>New here? The tutorial takes a few minutes and plays out each rule on the board.</p>
      <div class="btns"><button class="btn" id="wPlay">Play now</button><button class="btn primary" id="wLearn">Start tutorial</button></div>`, { sticky: true });
    $('#wPlay').onclick = closeSheet;
    $('#wLearn').onclick = () => { closeSheet(); tutStart(0); };
    try { localStorage.setItem(TKEY, '1'); } catch (e) { /* ignore */ }
    return sh;
  }

  /* ---------- tutorial ---------- */
  const LESSONS = [
    { title: 'The capture roll', blurb: 'Guilt and the pacifist rule',
      setup: { fen: '4k3/8/2n5/3p4/4P3/8/8/4K3 w - - 0 1' }, steps: [
        { say: 'Chess works as usual and you win by checkmate. The twist: the first time a piece captures, you roll a d6 for its reaction. 1 devastated, 2-3 guilt-ridden, 4-5 unaffected, 6 berserk. The reaction is permanent, and it applies to every later capture.' },
        { say: 'Capture the pawn on d5. The die is rigged to a 3.', expect: { f: 'e4', t: 'd5' }, rolls: [3], after: 'Guilt-ridden. A dark token sits under the pawn.', reply: { f: 'e8', t: 'f7' } },
        { select: 'd5', say: 'Tap the pawn. It still moves, but there is no capture ring on the knight at c6. A guilt-ridden piece is a pacifist: it can never capture, so it never gives check either. It can still block.' },
      ] },
    { title: 'Devastated', blurb: 'Roll a 1, then absolution',
      setup: { fen: '4k3/8/8/3p4/4P3/8/8/4KB2 w - - 0 1' }, steps: [
        { say: 'Capture on d5 again. This time the die is rigged to a 1.', expect: { f: 'e4', t: 'd5' }, rolls: [1], after: 'Devastated. The pawn cannot move, and if no bishop reaches it within 3 of your turns it self-destructs. The badge counts the turns left.', reply: { f: 'e8', t: 'e7' } },
        { say: 'A bishop next to a guilty or devastated friend absolves it after one full turn. Move the bishop to c4.', expect: { f: 'f1', t: 'c4' }, after: 'The bishop is beside the pawn. Once your opponent has moved, a full turn has passed and the pawn is absolved.', reply: { f: 'e7', t: 'd8' } },
        { say: 'The badge on d5 is gone. Absolution is passive, so you still moved a piece this turn, and one bishop absolves every afflicted friend around it at once.' },
      ] },
    { title: 'Mercy capture', blurb: 'Taking a devastated piece',
      setup: { fen: '4k3/8/8/3p4/8/8/8/3RK3 w - - 0 1', d: { d5: 2 }, r: { d5: 1 } }, steps: [
        { say: 'Black’s pawn on d5 is devastated and will self-destruct soon. It does not want to be on the board. Capture it with the rook.', expect: { f: 'd1', t: 'd5' }, after: 'A mercy capture. The rook is not affected and nothing is rolled. Its first real capture is still to come.', reply: { f: 'e8', t: 'e7' } },
      ] },
    { title: 'Bishops', blurb: 'Pacifists, and a heavy price',
      setup: { fen: '4k3/8/b3p3/8/2B5/8/8/R3K3 w - - 0 1' }, steps: [
        { select: 'c4', say: 'Bishops believe captures are abhorrent, so they are pacifists all game. There is no capture ring on the pawn on e6.' },
        { say: 'Capturing a bishop casts a ton of guilt on the capturer. Take the bishop on a6 with your rook.', expect: { f: 'a1', t: 'a6' }, after: 'Devastated at once, with no roll. The rook is frozen and will self-destruct unless it is saved.', reply: { f: 'e8', t: 'e7' } },
        { say: 'Send your own bishop to the rescue. Move it to b5, next to the rook.', expect: { f: 'c4', t: 'b5' }, after: 'After your opponent’s reply a full turn has passed and the rook is absolved.', reply: { f: 'e7', t: 'd7' } },
      ] },
    { title: 'Shame', blurb: 'Bishops turn enemy pieces',
      setup: { fen: '4k3/8/8/3p4/8/8/8/4KB2 w - - 0 1' }, steps: [
        { say: 'A bishop also shames enemy pieces next to it. Each full turn the piece gets worse. Move your bishop next to the pawn on d5: play c4.', expect: { f: 'f1', t: 'c4' }, after: 'The eye marks the pawn. Once its owner has moved, the shame begins.', reply: { f: 'e8', t: 'f7' } },
        { say: 'The pawn is guilt-ridden now. Wait one turn: any quiet move will do, so play your king to e2.', expect: { f: 'e1', t: 'e2' }, after: 'One turn later the pawn will be devastated.', reply: { f: 'f7', t: 'g7' } },
        { say: 'Devastated. One more turn, and the pawn will be converted. Move your king to e3.', expect: { f: 'e2', t: 'e3' }, after: 'Converted. The pawn changes sides and is reborn, so it rolls again on its first capture.', reply: { f: 'g7', t: 'h7' } },
        { say: 'The pawn on d5 is yours now. Only an enemy bishop next to the pawn cancels the shame, healing it after one full turn. Kings, bishops and berserkers cannot be shamed.' },
      ] },
    { title: 'Berserk', blurb: 'Roll a 6',
      setup: { fen: '4k3/8/8/p3p3/8/8/8/R3K3 w - - 0 1' }, steps: [
        { say: 'Roll a 6 and the piece enjoys it: it moves again after every capture. Take the pawn on a5. The die is rigged to a 6.', expect: { f: 'a1', t: 'a5' }, rolls: [6], after: 'An extra move. Your turn is not over.' },
        { say: 'Take the pawn on e5 too. A berserker gets two moves a turn at most, and it cannot be absolved, shamed or rallied.', expect: { f: 'a5', t: 'e5' }, after: 'Turn over. The berserk rook gives check.', reply: { f: 'e8', t: 'd7' } },
      ] },
    { title: 'Bloodlust', blurb: 'After three captures',
      setup: { fen: '4k3/8/8/8/8/P7/8/R2nK3 w - - 0 1', r: { a1: 4 }, n: { a1: 3 } }, steps: [
        { select: 'a1', say: 'A berserker that has taken three pieces is afflicted with bloodlust. This rook only moves to capture, and it will even take its own side. The rings show your pawn on a3 and the knight on d1.' },
        { say: 'Capture the knight on d1.', expect: { f: 'a1', t: 'd1' }, after: 'The extra move must also be a capture. There is none, so it is skipped for you.', reply: { f: 'e8', t: 'e7' } },
      ] },
    { title: 'Kings', blurb: 'Rally the Troops',
      setup: { fen: '4k3/8/8/8/7R/8/4K3/8 w - - 0 1', g: ['h4'], r: { h4: 2 } }, steps: [
        { say: 'The king called for the battle, so captures never affect it. Your rook on h4 is guilt-ridden. Bring the king toward it: play Kf3.', expect: { f: 'e2', t: 'f3' }, reply: { f: 'e8', t: 'e7' } },
        { say: 'Rally the Troops: a guilty or devastated piece next to its own king is cleared at once. Play Kg3, beside the rook.', expect: { f: 'f3', t: 'g3' }, after: 'The token is gone immediately. Berserkers are the one exception: the king cannot rally them.', reply: { f: 'e7', t: 'd7' } },
      ] },
    { title: 'Knights', blurb: 'One free capture',
      setup: { fen: '4k3/8/1p6/3p4/8/2N5/8/4K3 w - - 0 1' }, steps: [
        { say: 'Knights are combat trained. Their first capture is free: no roll. Take the pawn on d5. The star on the knight marks the free capture.', expect: { f: 'c3', t: 'd5' }, after: 'Free. The star is gone: the next capture rolls.', reply: { f: 'e8', t: 'f7' } },
        { say: 'Now take the pawn on b6. The die is rigged to a 2.', expect: { f: 'd5', t: 'b6' }, rolls: [2], after: 'Guilt-ridden after the second capture.', reply: { f: 'f7', t: 'e7' } },
      ] },
    { title: 'Promotion', blurb: 'Reborn as a bishop',
      setup: { fen: '7k/P7/8/8/8/8/8/4K3 w - - 0 1', g: ['a7'], r: { a7: 2 } }, steps: [
        { say: 'A promoted pawn keeps its guilt, so a queen would stay guilt-ridden. A bishop is reborn clean. Promote on a8 and choose a bishop.', expect: { f: 'a7', t: 'a8', p: 3 }, after: 'Reborn. A fresh bishop with no guilt and no history.', reply: { f: 'h8', t: 'g7' } },
      ] },
  ];
  app.LESSONS = LESSONS;

  function mkState(setup) {
    const s = E.fromFEN(setup.fen, 4242);
    for (const q of setup.g || []) s.g[idx(q)] = 1;
    for (const [q, n] of Object.entries(setup.d || {})) { s.g[idx(q)] = 1; s.d[idx(q)] = n; }
    for (const [q, n] of Object.entries(setup.r || {})) s.r[idx(q)] = n;
    for (const [q, n] of Object.entries(setup.n || {})) s.n[idx(q)] = n;
    for (const q of setup.h || []) s.h[idx(q)] = 1;
    return s;
  }
  function tutStart(li) {
    closeSheet();
    if (!app.tut) {
      cancelAI();
      app.stash = { states: app.states, keys: app.keys, recs: app.recs, plies: app.plies, log: app.log, status: app.status, view: app.view, settings: Object.assign({}, app.settings), seed: app.seed };
    }
    app.tut = { li, si: 0, phase: 'ask', tip: '', busy: false, complete: false, id: ((app.tut && app.tut.id) || 0) + 1 };
    const L = LESSONS[li];
    app.settings.mode = 'two'; app.settings.hints = true;
    const s = mkState(L.setup);
    app.states = [s]; app.keys = [E.keyOf(s)]; app.recs = []; app.plies = []; app.view = 1;
    app.log = [{ k: 'info', t: L.title }]; app.status = E.status(s, app.keys);
    showDice([]); tutEnterStep();
  }
  function tutExit(toNew) {
    const st = app.stash;
    if (st) {
      app.states = st.states; app.keys = st.keys; app.recs = st.recs; app.plies = st.plies; app.log = st.log; app.status = st.status; app.view = st.view;
      Object.assign(app.settings, st.settings); app.seed = st.seed;
    }
    app.tut = null; app.stash = null; app.sel = -1; app.legal = []; E.config.forced = null;
    showDice([]); render(); maybeAI();
    if (toNew) newSheet();
  }
  function tutStep() { return LESSONS[app.tut.li].steps[app.tut.si]; }
  function tutEnterStep() {
    const t = app.tut, step = tutStep();
    t.tip = ''; t.busy = false; t.complete = false; t.phase = step.expect ? 'ask' : 'done';
    t.dev = false; t.said = [];
    t.snap = { states: app.states.slice(), keys: app.keys.slice(), recs: app.recs.slice(), plies: app.plies.slice(), log: app.log.slice(), view: app.view };
    app.sel = -1; app.legal = [];
    if (step.select) select(idx(step.select), true);
    render();
  }
  function tutPlay(m) {
    const t = app.tut, step = tutStep(), ex = step.expect;
    if (t.busy) return;
    const ok = !!ex && t.phase === 'ask' && !t.dev && m.f === idx(ex.f) && m.t === idx(ex.t) && (!ex.p || m.p === ex.p) && !!ex.s === !!m.s;
    if (!ok) {
      if (ex && t.phase !== 'ask') {               // scripted step already done: playing on means Continue
        if (t.si + 1 < LESSONS[t.li].steps.length) { const si = t.si; tutNext(); if (app.tut && app.tut.si !== si) return tutPlay(m); return; }
        return tutFree(m);
      }
      return tutFree(m);                           // anything else legal is a free move
    }
    E.config.forced = (step.rolls || []).slice();
    commit(m);
    E.config.forced = null;
    t.phase = 'done'; t.tip = '';
    if (step.reply) {
      t.busy = true; const id = t.id, si = t.si;
      setTimeout(() => {
        if (!app.tut || app.tut.id !== id || app.tut.si !== si) return;
        const r = step.reply;
        const rm = app.status.moves.find((x) => x.f === idx(r.f) && x.t === idx(r.t) && (!r.p || x.p === r.p));
        if (rm) { E.config.forced = (step.replyRolls || []).slice(); commit(rm); E.config.forced = null; }
        app.tut.busy = false; renderTut();
      }, 950);
    }
    renderTut();
  }
  function tutFree(m) {
    const t = app.tut, from = app.log.length;
    t.dev = true; t.tip = '';
    cur().seed = ((Math.random() * 4294967295) >>> 0) || 1;   // real dice once you leave the script
    E.config.forced = null;
    commit(m);
    const say = () => { t.said = app.log.slice(from).map((l) => l.t).slice(-5); };
    say();
    const id = t.id;
    const replyLoop = () => {
      if (!app.tut || app.tut.id !== id) return;
      const s = cur();
      if (app.status.over || s.turn !== -1) { t.busy = false; say(); renderTut(); return; }
      t.busy = true; renderTut();
      setTimeout(() => {
        if (!app.tut || app.tut.id !== id) return;
        const r = E.search(cur(), { level: 1, history: {} });
        const mv = r && r.move && app.status.moves.find((x) => x.f === r.move.f && x.t === r.move.t && x.p === r.move.p && x.s === r.move.s);
        commit(mv || app.status.moves[0]);
        say(); replyLoop();
      }, 700);
    };
    replyLoop();
    renderTut();
  }
  function tutReset0() {   // restore the step's starting position without re-entering the step
    const sn = app.tut.snap;
    app.states = sn.states.slice(); app.keys = sn.keys.slice(); app.recs = sn.recs.slice(); app.plies = sn.plies.slice(); app.log = sn.log.slice(); app.view = sn.view;
    app.status = E.status(cur(), app.keys); E.config.forced = null; app.tut.dev = false; showDice([]);
  }
  function tutReset() {
    const t = app.tut; if (!t || !t.snap) return;
    const sn = t.snap;
    app.states = sn.states.slice(); app.keys = sn.keys.slice(); app.recs = sn.recs.slice(); app.plies = sn.plies.slice(); app.log = sn.log.slice(); app.view = sn.view;
    app.status = E.status(cur(), app.keys); E.config.forced = null; t.id++;
    showDice([]); tutEnterStep();
  }
  function tutNext() {
    const t = app.tut; if (!t || t.busy) return;
    if (t.dev) tutReset0();
    if (t.si + 1 < LESSONS[t.li].steps.length) { t.si++; tutEnterStep(); }
    else { t.complete = true; renderTut(); }
  }
  function renderTut() {
    const el = $('#tut');
    if (!app.tut) { el.innerHTML = ''; return; }
    const t = app.tut, L = LESSONS[t.li], step = L.steps[t.si];
    const dots = LESSONS.map((_, i) => `<i class="${i < t.li ? 'done' : i === t.li ? 'now' : ''}"></i>`).join('');
    let body;
    if (t.complete) {
      const last = t.li === LESSONS.length - 1;
      body = `<h2>${last ? 'That is everything' : 'Lesson complete'}</h2><p>${last ? 'You know every rule. Start a game and see what your pieces can live with.' : `Next: ${esc(LESSONS[t.li + 1].title)}.`}</p>
        <div class="btns"><button class="btn" id="tAgain">Replay</button><button class="btn primary" id="tOnward">${last ? 'Start playing' : 'Next lesson'}</button></div>`;
    } else {
      const after = t.phase === 'done' && !t.dev && step.after ? `<p class="after">${esc(step.after)}</p>` : '';
      const showNext = t.phase === 'done' && !t.busy;
      const said = t.dev && t.said.length ? `<div class="said">${t.said.map((x) => `<p>${esc(x)}</p>`).join('')}</div>` : '';
      const explore = t.dev ? `<p class="tip2">${t.busy ? 'The computer is replying…' : step.expect ? 'You stepped off the script, which is fine. Keep playing, or reset the step to get back to the lesson.' : 'Keep exploring. Continue picks the lesson back up.'}</p>` : '';
      const btns = [];
      if (showNext) btns.push('<button class="btn primary" id="tNext">Continue</button>');
      if (t.dev && step.expect) btns.push('<button class="btn primary" id="tReset">Reset step</button>');
      if (!showNext || t.dev) btns.push('<button class="btn" id="tAgain">Restart lesson</button>');
      body = `<p class="say">${esc(step.say)}</p>${after}${said}${explore}
        <div class="btns">${btns.join('')}</div>`;
    }
    el.innerHTML = `<div class="thead"><span>Lesson ${t.li + 1} of ${LESSONS.length} · ${esc(L.title)}</span><button id="tExit">Exit</button></div><div class="tdots">${dots}</div>${body}`;
    const q = (id) => $(id, el);
    if (q('#tExit')) q('#tExit').onclick = () => tutExit(false);
    if (q('#tNext')) q('#tNext').onclick = tutNext;
    if (q('#tReset')) q('#tReset').onclick = tutReset;
    if (q('#tAgain')) q('#tAgain').onclick = () => tutStart(t.li);
    if (q('#tOnward')) q('#tOnward').onclick = () => (t.li === LESSONS.length - 1 ? tutExit(true) : tutStart(t.li + 1));
  }
  function tutorialSheet() {
    const sh = sheet(`<h2>Tutorial</h2><p>Each lesson sets up a position and suggests a move, but you can play anything legal: the computer answers with real dice. Reset the step to get back to the lesson.</p>
      <div class="lessons">${LESSONS.map((l, i) => `<button data-l="${i}"><span class="num">${i + 1}</span><span><b>${esc(l.title)}</b><small>${esc(l.blurb)}</small></span></button>`).join('')}</div>
      <div class="btns"><button class="btn" id="tuClose">Close</button><button class="btn primary" data-l="0">Start from lesson 1</button></div>`);
    sh.querySelectorAll('[data-l]').forEach((b) => (b.onclick = () => tutStart(+b.dataset.l)));
    $('#tuClose').onclick = closeSheet;
  }

  /* ---------- wiring ---------- */
  function init() {
    $('#board').addEventListener('click', (e) => { const q = e.target.closest('.sq'); if (q) onSquare(+q.dataset.i); });
    $('#dice').addEventListener('click', () => $('#dice').classList.remove('on'));
    $('#bar').addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b || b.disabled) return;
      const a = b.dataset.act;
      if (a === 'undo') undo();
      else if (a === 'flip') { app.view = -app.view; save(); render(); }
      else if (a === 'moves') movesSheet();
      else if (a === 'new') newSheet();
      else if (a === 'rules') rulesSheet();
      else if (a === 'learn') tutorialSheet();
    });
    let seen = false;
    try { seen = !!localStorage.getItem(TKEY); } catch (e) { seen = true; }
    const saved = load();
    if (saved && saved.s && Array.isArray(saved.r)) {
      Object.assign(app.settings, saved.s);
      delete app.settings.rules;
      app.seed = saved.seed || 1;
      if (replay(saved.r)) {
        app.view = saved.v === -1 ? -1 : 1;
        app.log = [{ k: 'info', t: saved.r.length ? 'Game resumed.' : 'The pieces take their places. White moves first.' }];
        if (app.status.over) app.log.push({ k: 'check', t: app.status.winner ? `${side(app.status.winner)} wins. ${resultText(app.status.result)}` : 'Draw. ' + resultText(app.status.result) });
        if (cur().extra >= 0 && !aiToMove()) select(cur().extra, true);
        render(); maybeAI(); if (!seen) welcomeSheet(); return;
      }
    }
    newGame({});
    if (!seen) welcomeSheet();
  }
  init();
})();

</script>
<style>:root{--gutter:6px;--sat:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));--sab:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));--sal:max(env(safe-area-inset-left,0px),var(--safe-area-inset-left,0px));--sar:max(env(safe-area-inset-right,0px),var(--safe-area-inset-right,0px))}#app{padding-top:calc(4px + var(--sat));padding-bottom:var(--sab);padding-left:max(var(--gutter),var(--sal));padding-right:max(var(--gutter),var(--sar))}.sheet{padding-bottom:calc(20px + var(--sab))}#tut .btns{padding-bottom:max(8px,var(--sab))}</style>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* offline cache unavailable */ });
  });
}
</script>
</body>
